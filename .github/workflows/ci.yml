name: CI
on:
  push:
    branches: [feature/reliable-messaging-foundation, dev, main]
  pull_request:
    branches: [dev, main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B -ntp clean verify
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: '**/target/*-reports/*'
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set ephemeral credentials
        shell: pwsh
        run: |
          $dbPassword=[guid]::NewGuid().ToString('N')
          $rabbitPassword=[guid]::NewGuid().ToString('N')
          Write-Output "::add-mask::$dbPassword"
          Write-Output "::add-mask::$rabbitPassword"
          "DB_PASSWORD=$dbPassword" >> $env:GITHUB_ENV
          "RABBIT_PASSWORD=$rabbitPassword" >> $env:GITHUB_ENV
      - run: docker compose -f compose.yaml -f compose.failure.yaml up -d --build --wait --wait-timeout 180
      - shell: pwsh
        run: ./scripts/smoke.ps1
      - shell: pwsh
        run: ./scripts/failure-smoke.ps1 -Project notifyflow
      - if: failure()
        run: docker compose logs --tail 120
      - if: always()
        run: docker compose down -v
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
