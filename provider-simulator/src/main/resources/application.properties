spring.application.name=notifyflow-provider
server.port=8082
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=15s
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/notifyflow}
spring.datasource.username=${DB_USER:notifyflow}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=6
spring.datasource.hikari.connection-timeout=3000
spring.flyway.locations=classpath:db/provider
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.username=${RABBIT_USER:notifyflow}
spring.rabbitmq.password=${RABBIT_PASSWORD:unused}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.connection-timeout=3000
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.recovery-interval=3000
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-stacktrace=never
spring.mvc.problemdetails.enabled=true
logging.structured.format.console=logstash
notifyflow.provider-url=${PROVIDER_URL:http://localhost:8082}
notifyflow.worker-url=${WORKER_URL:http://localhost:8081}
notifyflow.scenarios-enabled=${SCENARIOS_ENABLED:false}
